[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnpcorr"
version = "1.0.0"
description = "PnPCorrespondences: synthetic 2D-3D point-correspondence datasets for camera calibration and PnP benchmarking"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aizierjiang Aiersilan" }]
maintainers = [{ name = "Aizierjiang Aiersilan" }]
keywords = [
    "camera-calibration", "perspective-n-point", "pnp", "pose-estimation",
    "bundle-adjustment", "lens-distortion", "synthetic-dataset", "benchmark",
    "computer-vision",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
solvers = ["opencv-python>=4.10"]
figures = ["matplotlib>=3.8"]
hub = ["huggingface_hub>=0.25"]
all = ["opencv-python>=4.10", "matplotlib>=3.8", "huggingface_hub>=0.25", "pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/Ezharjan/PnPCorrespondences"
Repository = "https://github.com/Ezharjan/PnPCorrespondences"
Issues = "https://github.com/Ezharjan/PnPCorrespondences/issues"

[tool.setuptools]
packages = ["pnpcorr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
